# Nightly lightning forecast: score tomorrow for every cell, re-score the track record against reported
# lightning fires, and publish both to Vercel Blob, where the site reads them.
# Needs the forecast kit (python ml/forecast.py pack) as an asset on the "forecast-kit" release, and a
# BLOB_READ_WRITE_TOKEN secret for the site's Blob store.
name: Forecast

on:
  schedule:
    - cron: "0 1 * * *"   # 6 pm in California in summer, 5 pm in winter
    # Backups in case a weather source was down; they stop early if tonight's forecast is already out.
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: forecast

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - name: Is tonight's forecast already out?
        id: check
        # Only the backups check: the main run always issues, even over a forecast a late backup put out.
        if: github.event_name == 'schedule' && github.event.schedule != '0 1 * * *'
        run: |
          url=https://tglvkcgk3j17bof7.public.blob.vercel-storage.com/forecast/lightning/latest.json  # FORECAST_URL in web/src/lib.js
          issued=$(curl -fsS "$url" | python3 -c "import json, sys; print(json.load(sys.stdin)['issued'])" || true)
          # GitHub can start a backup hours late; before noon Pacific it still belongs to the evening before
          # (EVENING in ml/forecast.py).
          evening=$(TZ=America/Los_Angeles date -d '12 hours ago' +%F)
          echo "latest.json issued ${issued:-?}, tonight is $evening"
          echo "done=$([[ "$issued" > "$evening" || "$issued" = "$evening" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  forecast:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-forecast.txt
      - run: pip install -r ml/requirements-forecast.txt
      - name: Download the forecast kit
        run: gh release download forecast-kit --pattern forecast_kit.joblib --dir private
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Score tomorrow
        run: python ml/forecast.py run --kit private/forecast_kit.joblib --out out
      - name: Update the track record
        # If the fire feed is down, still publish tonight's forecast; the record catches up the next night.
        continue-on-error: true
        run: python ml/track.py update --kit private/forecast_kit.joblib --forecast out/latest.json --out out
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/forecast/package-lock.json
      - name: Publish to Vercel Blob
        working-directory: deploy/forecast
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          node publish.mjs ../../out
